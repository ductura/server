name: DOCX provenance spike

# SRV-1802 (M8.8): tests and OSV scan of spikes/docx-provenance. The spike has
# its own lockfile and is not part of pnpm test (vitest does not read spikes/),
# so it gets its own job. Weekly, because a new advisory needs no code change.
on:
  push:
    branches: [main, migracija/kopija-ductus-backend]
    paths: ["spikes/docx-provenance/**", ".github/workflows/docx-provenance-spike.yml"]
  pull_request:
    paths: ["spikes/docx-provenance/**", ".github/workflows/docx-provenance-spike.yml"]
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: docx-provenance-spike-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash
    working-directory: spikes/docx-provenance

jobs:
  docx-provenance:
    name: DOCX provenance spike (testovi i OSV)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Instalacija (točan lockfile)
        run: pnpm install --frozen-lockfile --ignore-workspace
      - name: Testovi
        run: node --test *.test.ts
      - name: OSV, bez HIGH i CRITICAL nalaza
        run: node osv-scan.ts pnpm-lock.yaml
