name: CI
on:
  push: { branches: [main, migracija/kopija-ductus-backend] }
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# DAN-867: every run step is bash -eo pipefail (scripts/ci/shell.ts); without
# it GitHub runs bash -e {0}, and a failed command in a pipe passes.
defaults:
  run:
    shell: bash
# DAN-721: scope picks the jobs from the changed paths, ci-ok is the one
# aggregate status. Both run scripts/ci from protected main (the PR base), never
# from the PR head, so a PR cannot skip its own database job. A base without
# scripts/ci (bootstrap) runs everything and requires every job to succeed.
jobs:
  scope:
    name: Opseg CI-ja
    runs-on: ubuntu-latest
    outputs:
      profile: ${{ steps.classify.outputs.profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref == 'main' && github.event.pull_request.base.sha || 'main' }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Razvrstavanje promjena
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" != pull_request ] || [ "$PR_BASE_REF" != main ]; then
            echo 'profile=full' >> "$GITHUB_OUTPUT"
          elif [ ! -f scripts/ci/scope.ts ] || [ -L scripts/ci/scope.ts ]; then
            echo 'profile=full' >> "$GITHUB_OUTPUT"
          else
            [[ "$PR_HEAD" =~ ^[a-f0-9]{40}$ ]]
            git fetch --no-tags --depth=1 origin "$PR_HEAD"
            node scripts/ci/scope.ts >> "$GITHUB_OUTPUT"
          fi

  checks:
    name: Provjere i testovi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Provjera tipova
        run: pnpm typecheck
      # D-91 (1), S-0.13: db/main/migrations.sum matches the files, and no
      # migration of the base (PR base, or main before this push) changed or
      # disappeared. On a PR the checkout is the merge commit, so main's newer
      # migrations count. Ported from the Ductus step "Migration ledger (D-91)".
      - name: Knjiga migracija (D-91)
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base=""
          if [ "$EVENT_NAME" = pull_request ]; then base="$PR_BASE"; elif [ "$EVENT_NAME" = push ]; then base="$PUSH_BEFORE"; fi
          if [ -n "$base" ]; then
            [[ "$base" =~ ^[a-f0-9]{40}$ ]]
            git fetch --no-tags --depth=1 origin "$base"
            node scripts/db/migrations-ledger.ts --base "$base"
          else
            node scripts/db/migrations-ledger.ts
          fi
      - name: Lint
        run: pnpm lint
      - name: Formatiranje
        run: pnpm format:check
      - name: Unit testovi
        run: pnpm test:unit
      # SRV-1512 (plan M7.9, R-07): the text of an invented work in the API, the
      # export snapshot and the DOCX must be the same; a difference fails the build.
      # Its own step, so the check is visible and stays required through ci-ok.
      - name: Test jednakosti prikaza (R-07)
        run: pnpm test:equality
      - name: Svojstveni testovi
        run: pnpm test:property
      - name: Integracijski testovi
        run: pnpm test:integration
      # U10-b (DAN-742): the whole path of publish.yml except the upload, with
      # no token: stage and check, pack, check the unpacked tarball, and a dry
      # run of `npm publish` of each tarball.
      - name: Probna objava
        run: |
          pnpm release:check
          pnpm release:tarball contracts test-fakes
          for file in dist/release/tarball/*.tgz; do npm publish --dry-run --ignore-scripts "$file"; done
      - name: Zaštita od lomljenja ugovora
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
          pnpm contracts:breaking FETCH_HEAD
      # DAN-893: the image of the web process (infra/web), built and started as a
      # deployment would, with an invented database URL on an .invalid host. In
      # checks, not a job of its own: ci-ok runs from main and refuses an
      # unknown job. Also on the docs profile, an accepted cost.
      - name: Slika web procesa (DAN-893)
        run: |
          docker build -f infra/web/Dockerfile -t ductura-web:ci .
          [ "$(docker run --rm --entrypoint find ductura-web:ci /app | sort | tr '\n' ' ')" = "/app /app/dist /app/dist/server.js " ]
          [ "$(docker run --rm --entrypoint id ductura-web:ci -u)" != 0 ]
          docker image inspect ductura-web:ci \
            | jq -e '[.[0].Config.Env[] | split("=")[0]] - ["PATH", "NODE_VERSION", "YARN_VERSION", "HOST", "PORT"] == []'
          trap 'docker logs ductura-web' EXIT
          docker run -d --name ductura-web -p 127.0.0.1:4000:4100 -e PORT=4100 \
            -e APP_DATABASE_URL=postgres://app@db.invalid:5432/ductura ductura-web:ci
          for _ in $(seq 60); do
            status="$(docker inspect -f '{{.State.Health.Status}}' ductura-web)"
            [ "$status" = starting ] || break
            sleep 1
          done
          [ "$status" = healthy ]
          curl -fsS "http://127.0.0.1:4000/api/v1/health"
          # SIGTERM reaches node as PID 1 (exec form) and shuts down cleanly.
          docker stop ductura-web
          [ "$(docker inspect -f '{{.State.ExitCode}}' ductura-web)" = 0 ]
      - name: Slika testnog servera (DAN-938)
        run: |
          docker build -f infra/web/Dockerfile --target test-server -t ductura-test-server:ci .
          [ "$(docker run --rm --entrypoint find ductura-test-server:ci /app | sort | tr '\n' ' ')" = "/app /app/dist /app/dist/server.js " ]
          [ "$(docker run --rm --entrypoint id ductura-test-server:ci -u)" != 0 ]
          docker image inspect ductura-test-server:ci \
            | jq -e '[.[0].Config.Env[] | select(test("^(PATH|NODE_VERSION|YARN_VERSION)=") | not)] | sort
                == ["DUCTURA_MODE=test", "HOST=0.0.0.0", "NODE_ENV=test", "PORT=4000"]'
          trap 'docker logs ductura-test-server' EXIT
          docker run -d --name ductura-test-server -p 127.0.0.1:4001:4100 -e PORT=4100 \
            -e APP_DATABASE_URL=postgres://app@db.invalid:5432/ductura ductura-test-server:ci
          for _ in $(seq 60); do
            status="$(docker inspect -f '{{.State.Health.Status}}' ductura-test-server)"
            [ "$status" = starting ] || break
            sleep 1
          done
          [ "$status" = healthy ]
          curl -fsS "http://127.0.0.1:4001/api/v1/health"
          docker stop ductura-test-server
          [ "$(docker inspect -f '{{.State.ExitCode}}' ductura-test-server)" = 0 ]

  database:
    name: PostgreSQL i pgTAP
    needs: scope
    if: needs.scope.outputs.profile == 'full'
    runs-on: ubuntu-latest
    env:
      PGBIN: /usr/lib/postgresql/17/bin
      PGPORT: "5499"
      PGUSER: postgres
      PGDATABASE: ductura_ci
      DUCTUS_NATIVE_PGPORT: "5498"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # DAN-953: one retry for this step only, 30 s after a failed attempt.
      # The commands are chained with && because bash ignores set -e inside
      # `f || ...`. A retry overwrites what the first attempt wrote (curl -o,
      # install -D, tee without -a). Tested in scripts/ci/pgdg-retry.test.ts.
      - name: Instalacija PostgreSQL-a (PGDG)
        env:
          PGDG_KEY_FINGERPRINT: B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
        run: |
          pgdg_install() {
            curl -fsSL -o "$RUNNER_TEMP/pgdg.asc" https://www.postgresql.org/media/keys/ACCC4CF8.asc &&
              gpg --show-keys --with-colons "$RUNNER_TEMP/pgdg.asc" | grep -qx "fpr:::::::::$PGDG_KEY_FINGERPRINT:" &&
              sudo install -D -m 0644 "$RUNNER_TEMP/pgdg.asc" /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc &&
              . /etc/os-release &&
              echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
                | sudo tee /etc/apt/sources.list.d/pgdg.list &&
              sudo apt-get update -q &&
              sudo apt-get install -y -q --no-install-recommends postgresql-17 postgresql-17-pgtap libtap-parser-sourcehandler-pgtap-perl
          }
          pgdg_install || { echo "::warning::PGDG install failed, retrying once in 30 s"; sleep 30; pgdg_install; }
      - name: Pokretanje baze
        run: |
          echo "PGHOST=$RUNNER_TEMP" >> "$GITHUB_ENV"
          export PGHOST="$RUNNER_TEMP"
          "$PGBIN/initdb" -D "$RUNNER_TEMP/pgdata" -U postgres --auth=trust --encoding=UTF8 --locale=C.UTF-8
          "$PGBIN/pg_ctl" -D "$RUNNER_TEMP/pgdata" -l "$RUNNER_TEMP/pg.log" -w start \
            -o "-p $PGPORT -k $RUNNER_TEMP -c listen_addresses=''"
          "$PGBIN/createdb" ductura_ci
          "$PGBIN/psql" -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION pgtap'
      - name: pgTAP testovi
        run: |
          shopt -s nullglob
          files=(db/tests/*.sql)
          if [ "${#files[@]}" -eq 0 ]; then echo 'No pgTAP test files found.' >&2; exit 1; fi
          pg_prove --psql-bin "$PGBIN/psql" --failures "${files[@]}"
      # S-0.13 (DAN-726): the migration tests in tests/db, ported from Ductus
      # tests/integration, need the database of the Ductus local stack and CI:
      # 127.0.0.1:54329, database and superuser ductus with the public
      # local-only password of Ductus compose.yaml (no secret). A second
      # cluster of the same PostgreSQL 17, so the pgTAP smoke test above keeps
      # its own. The roles come from db/main/local/migrator.sql, then every
      # migration runs through the locked runner as ductus_migrator, as Ductus
      # `pnpm db:migrate` does.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Baza za migracije
        env:
          MAIN_PASSWORD: ductus-local-only
        run: |
          printf '%s\n' "$MAIN_PASSWORD" > "$RUNNER_TEMP/main-password"
          "$PGBIN/initdb" -D "$RUNNER_TEMP/main-data" -U ductus --pwfile="$RUNNER_TEMP/main-password" \
            --auth-local=trust --auth-host=scram-sha-256 --encoding=UTF8 --locale=C.UTF-8
          "$PGBIN/pg_ctl" -D "$RUNNER_TEMP/main-data" -l "$RUNNER_TEMP/main.log" -w start \
            -o "-p 54329 -k $RUNNER_TEMP -c listen_addresses=127.0.0.1"
          "$PGBIN/psql" "postgres://ductus:$MAIN_PASSWORD@127.0.0.1:54329/postgres" -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE ductus'
      - name: Uloge i migracije (migrate-locked)
        env:
          DATABASE_URL: postgres://ductus:ductus-local-only@127.0.0.1:54329/ductus
        run: |
          "$PGBIN/psql" "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f db/main/local/migrator.sql
          node scripts/db/migrate-locked.ts --url "$DATABASE_URL?sslmode=disable&role=ductus_migrator"
          # S-0.17 (DAN-730): the local login of the web process, ductus_app_local
          # (APP_DATABASE_URL of the database project in vitest.config.ts), as
          # Ductus `pnpm db:migrate` provisions it. The file refuses TCP, so it
          # runs over this cluster's socket.
          "$PGBIN/psql" -h "$RUNNER_TEMP" -p 54329 -U ductus -d ductus -v ON_ERROR_STOP=1 -q -f db/main/local/app-login.sql
          applied="$("$PGBIN/psql" "$DATABASE_URL" -tAc 'SELECT count(*) FROM public.schema_migrations')"
          files="$(find db/main/migrations -maxdepth 1 -name '*.sql' | wc -l)"
          echo "Primijenjeno $applied od $files migracija."
          [ "$applied" -eq "$files" ]
      # S-1F-c a2 (DAN-779): the legal texts database next to the main one, in
      # the cluster above, as `pnpm db:migrate:legal` makes it: created once,
      # provisioned by db/legal/local/migrator.sql, migrated by `migrate-locked
      # --database legal` as ductus_legal_migrator.
      - name: Baza pravnih tekstova (migrate-locked --database legal)
        env:
          DATABASE_URL: postgres://ductus:ductus-local-only@127.0.0.1:54329/ductus
          LEGAL_DATABASE_URL: postgres://ductus:ductus-local-only@127.0.0.1:54329/ductus_legal
        run: |
          "$PGBIN/psql" "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f db/legal/local/create-database.sql
          "$PGBIN/psql" "$LEGAL_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f db/legal/local/migrator.sql
          node scripts/db/migrate-locked.ts --database legal --url "$LEGAL_DATABASE_URL?sslmode=disable&role=ductus_legal_migrator"
          applied="$("$PGBIN/psql" "$LEGAL_DATABASE_URL" -tAc 'SELECT count(*) FROM public.schema_migrations')"
          files="$(find db/legal/migrations -maxdepth 1 -name '*.sql' | wc -l)"
          echo "Primijenjeno $applied od $files migracija baze pravnih tekstova."
          [ "$applied" -eq "$files" ]
      # S-1F-c (DAN-779): the logs database in a cluster of its own, as compose
      # postgres-logs (127.0.0.1:54330, superuser ductus with the public
      # local-only password of compose.yaml, no secret). It is provisioned by
      # db/logs/local/migrator.sql and migrated by `migrate-locked --database
      # logs` as ductus_logs_migrator, as `pnpm db:migrate:logs` does;
      # tests/db/logs-database.integration.test.ts (pnpm test:database) checks
      # it next to the main database above. wal_level=logical lets
      # tests/db/log-chain-base-replication.integration.test.ts apply logical
      # replication to the chain base (DAN-868-1a).
      - name: Baza zapisa (migrate-locked --database logs)
        env:
          LOGS_PASSWORD: ductus-logs-local-only
          LOGS_DATABASE_URL: postgres://ductus:ductus-logs-local-only@127.0.0.1:54330/ductus_logs
        run: |
          printf '%s\n' "$LOGS_PASSWORD" > "$RUNNER_TEMP/logs-password"
          "$PGBIN/initdb" -D "$RUNNER_TEMP/logs-data" -U ductus --pwfile="$RUNNER_TEMP/logs-password" \
            --auth-local=trust --auth-host=scram-sha-256 --encoding=UTF8 --locale=C.UTF-8
          "$PGBIN/pg_ctl" -D "$RUNNER_TEMP/logs-data" -l "$RUNNER_TEMP/logs.log" -w start \
            -o "-p 54330 -k $RUNNER_TEMP -c listen_addresses=127.0.0.1 -c wal_level=logical"
          "$PGBIN/psql" "postgres://ductus:$LOGS_PASSWORD@127.0.0.1:54330/postgres" -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE ductus_logs'
          "$PGBIN/psql" "$LOGS_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f db/logs/local/migrator.sql
          node scripts/db/migrate-locked.ts --database logs --url "$LOGS_DATABASE_URL?sslmode=disable&role=ductus_logs_migrator"
          applied="$("$PGBIN/psql" "$LOGS_DATABASE_URL" -tAc 'SELECT count(*) FROM public.schema_migrations')"
          files="$(find db/logs/migrations -maxdepth 1 -name '*.sql' | wc -l)"
          echo "Primijenjeno $applied od $files migracija baze zapisa."
          [ "$applied" -eq "$files" ]
      # S-0.14 (DAN-727): `pnpm db:up:native` brings the main database up
      # natively, as on a developer machine, on its own cluster of the
      # runner user (socket as superuser, loopback TCP with SCRAM), twice: the
      # second run must change nothing. Then the roles it made are compared
      # with the Ductus list (tests/db/local-roles.integration.test.ts, in
      # pnpm test:database).
      - name: Lokalni stog, nativno (pnpm db:up:native)
        run: |
          echo "DUCTUS_NATIVE_PGSOCKET=$RUNNER_TEMP" >> "$GITHUB_ENV"
          export DUCTUS_NATIVE_PGSOCKET="$RUNNER_TEMP"
          "$PGBIN/initdb" -D "$RUNNER_TEMP/native-data" -U "$(id -un)" \
            --auth-local=trust --auth-host=scram-sha-256 --encoding=UTF8 --locale=C.UTF-8
          "$PGBIN/pg_ctl" -D "$RUNNER_TEMP/native-data" -l "$RUNNER_TEMP/native.log" -w start \
            -o "-p $DUCTUS_NATIVE_PGPORT -k $RUNNER_TEMP -c listen_addresses=127.0.0.1"
          PATH="$PGBIN:$PATH" pnpm db:up:native
          PATH="$PGBIN:$PATH" pnpm db:up:native
      # ZEL-S1 (Ductus#2028 c.7020129567): the local S3 of the copied Ductus
      # tests in pnpm test:database (tests/db/ductus/*payload*, *storage*), as
      # Ductus runs it: RustFS 1.0.0 on 127.0.0.1:9100 with the public
      # local-only keys of Ductus compose.yaml (no secret). Natively, as Ductus
      # scripts/local/native/up.mjs starts it, so S-0.14 holds. The archive is
      # checked against the published SHA-256 before it is unpacked or run.
      - name: Lokalni S3 (RustFS 1.0.0, nativno)
        env:
          RUSTFS_URL: https://github.com/rustfs/rustfs/releases/download/1.0.0/rustfs-linux-x86_64-gnu-v1.0.0.zip
          RUSTFS_SHA256: 2d5059501745682664c3d345b22274b66079c952fbec7e1ce66980ef4515cd42
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/rustfs.zip" "$RUSTFS_URL"
          echo "$RUSTFS_SHA256  $RUNNER_TEMP/rustfs.zip" | sha256sum -c --strict -
          unzip -q "$RUNNER_TEMP/rustfs.zip" rustfs -d "$RUNNER_TEMP/rustfs"
          mkdir -p "$RUNNER_TEMP/rustfs-data"
          RUSTFS_ACCESS_KEY=ductus-local RUSTFS_SECRET_KEY=ductus-local-only RUSTFS_CONSOLE_ENABLE=false \
            nohup "$RUNNER_TEMP/rustfs/rustfs" server --address 127.0.0.1:9100 "$RUNNER_TEMP/rustfs-data" \
            > "$RUNNER_TEMP/rustfs.log" 2>&1 &
          # Ready only when the S3 layer refuses anonymous listing (403), as Ductus checks it.
          # Each probe is bounded, so a listener that never answers cannot hold the 30 s limit.
          deadline=$((SECONDS + 30))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if [ "$(curl -s --max-time 2 -o /dev/null -w '%{http_code}' http://127.0.0.1:9100/)" = 403 ]; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/rustfs.log" >&2
          exit 1
      - name: Testovi migracija
        env:
          DATABASE_URL: postgres://ductus:ductus-local-only@127.0.0.1:54329/ductus
          LOGS_DATABASE_URL: postgres://ductus:ductus-logs-local-only@127.0.0.1:54330/ductus_logs
        run: pnpm test:database
      # S-0.15 (DAN-728): the pgTAP matrix ported from Ductus db/tests
      # (db/main/tests) against the migrated and provisioned native main
      # database from `pnpm db:up:native` above, as Ductus runs
      # `pg_prove --recurse --ext .sql` after `pnpm db:migrate`. The smoke step
      # above globs only db/tests, so the matrix never runs on its empty database.
      - name: pgTAP glavne baze (pnpm test:db:native)
        run: PATH="$PGBIN:$PATH" pnpm test:db:native
      # S-1F-d (DAN-797): the pgTAP of the logs and legal databases, each over
      # its own migrated database from the steps above, as the superuser over
      # the cluster's socket. scripts/db/pgtap.ts fails the step when a test
      # file did not run or nothing was tested, so the database job, and with
      # it ci-ok, cannot pass on an empty or skipped suite.
      - name: pgTAP baze zapisa (pnpm test:db:logs)
        env:
          PGPORT: "54330"
          PGUSER: ductus
          PGDATABASE: ductus_logs
        run: PATH="$PGBIN:$PATH" pnpm test:db:logs
      - name: pgTAP baze pravnih tekstova (pnpm test:db:legal)
        env:
          PGPORT: "54329"
          PGUSER: ductus
          PGDATABASE: ductus_legal
        run: PATH="$PGBIN:$PATH" pnpm test:db:legal
      # DAN-759: the VS-1 stack (scripts/stack) on its own cluster and ports,
      # after every step above, so it weakens none of them. up waits for
      # /api/v1/health; down must leave no port of the stack answering and no
      # process of it running.
      - name: Stog VS-1 (pnpm stack:vs1 up --env ci)
        id: vs1-up
        run: |
          pnpm build
          PATH="$PGBIN:$PATH" pnpm stack:vs1 up --env ci
          # DAN-787, DAN-817: read only; 0 only when PostgreSQL, fake OIDC and the server run and answer, and the local S3 listens.
          PATH="$PGBIN:$PATH" pnpm stack:vs1 status
          curl -fsS http://127.0.0.1:4100/api/v1/health
          # DAN-817 (E1, P6): a real evidence/commit on the stack is 200 with a verified
          # receipt and an object in the local S3; the same build under production is 503.
          PATH="$PGBIN:$PATH" node scripts/stack/vs1-commit-check.ts
          # Health reads no database: check that the server's own login reaches it.
          "$PGBIN/psql" "postgres://ductus_app_local:ductus-app-local-only@127.0.0.1:54360/ductus" -tAc 'SELECT 1'
      # Also after a failed up, but not when the job stopped before it (then
      # nothing of the stack runs and pnpm may not even be installed).
      - name: Gašenje stoga VS-1 (pnpm stack:vs1 down)
        if: always() && steps.vs1-up.outcome != 'skipped'
        run: |
          PATH="$PGBIN:$PATH" pnpm stack:vs1 down
          for port in 54360 4100 4180 4191; do
            if (exec 3<>"/dev/tcp/127.0.0.1/$port") 2>/dev/null; then echo "port $port still answers" >&2; exit 1; fi
          done
          if pgrep -f "$GITHUB_WORKSPACE/(dist/server.js|.stack/vs1/pgdata|packages/test-fakes/oidc/server.ts|scripts/stack/local-s3.ts)"; then
            echo "a process of the stack is still running" >&2; exit 1
          fi

  ci-ok:
    name: ci-ok
    needs: [scope, checks, database]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref == 'main' && github.event.pull_request.base.sha || 'main' }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Zbirna provjera
        env:
          PROFILE: ${{ needs.scope.outputs.profile }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          if [ -f scripts/ci/ci-ok.ts ] && [ ! -L scripts/ci/ci-ok.ts ]; then
            printf '%s' "$NEEDS" | node scripts/ci/ci-ok.ts
          else
            printf '%s' "$NEEDS" | jq -e 'length == 3 and all(.[]; .result == "success")'
          fi
